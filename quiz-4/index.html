
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Legislation Quiz 4 | Center JUST</title>
<style>
:root{
  --navy:#0a1428; --navy2:#101e3a; --gold:#c9a24b; --gold2:#e6c878;
  --parch:#f6efdc; --parch2:#ebe0c4; --ink:#1d2433;
  --blue:#1f5fbf; --blueBg:#dbe8fb; --red:#b8322f; --redBg:#fadcda;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Georgia,"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
  color:var(--parch);
  background:radial-gradient(ellipse at 50% 0%,#17274b 0%,var(--navy) 55%,#050a16 100%) fixed;
  display:flex;justify-content:center;padding:18px 14px 40px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:repeating-linear-gradient(45deg,var(--gold) 0 1px,transparent 1px 18px);
}
.wrap{width:100%;max-width:760px;position:relative;z-index:1}
.screen{display:none;animation:rise .5s ease both}
.screen.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.brand{text-align:center}
.brand img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.brand .name{font-size:1.5rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin-top:6px;font-weight:bold}
.rule{height:2px;margin:14px auto;width:60%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.panel{
  background:linear-gradient(180deg,var(--parch) 0%,var(--parch2) 100%);
  color:var(--ink);border-radius:14px;padding:28px 24px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px rgba(201,162,75,.15),0 18px 40px rgba(0,0,0,.55);
}
h1{font-size:2rem;text-align:center;color:var(--navy);line-height:1.2}
.sub{text-align:center;margin:12px 0 20px;font-style:italic;color:#46506a;font-size:1.05rem}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.chip{background:var(--navy);color:var(--gold2);border:1px solid var(--gold);border-radius:30px;padding:8px 16px;font-size:.95rem}
.chip b{color:#fff}

button{font-family:inherit;cursor:pointer}
.btn{
  display:block;width:100%;padding:16px;font-size:1.15rem;font-weight:bold;letter-spacing:.06em;
  color:var(--navy);border:none;border-radius:10px;text-transform:uppercase;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  box-shadow:0 4px 0 #8c6c25,0 8px 18px rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s,filter .2s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8c6c25}

.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:1rem;color:var(--gold2)}
.hud .mini{display:flex;align-items:center;gap:8px}
.hud img{width:42px;height:42px;object-fit:contain}
.score-badge{background:var(--navy2);border:1px solid var(--gold);border-radius:30px;padding:6px 14px;color:#fff}
.score-badge span{color:var(--gold2);font-weight:bold}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;border:1px solid rgba(201,162,75,.4);margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}
.streak{text-align:center;min-height:22px;color:var(--gold2);font-style:italic;margin-bottom:8px}

.qtype{display:inline-block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;background:var(--navy);color:var(--gold2);padding:4px 12px;border-radius:20px;margin-bottom:14px}
.question{font-size:1.3rem;line-height:1.45;color:var(--navy);font-weight:bold;margin-bottom:20px}
.opts{display:grid;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  min-height:58px;padding:12px 16px;font-size:1.05rem;line-height:1.35;color:var(--ink);
  background:#fffaf0;border:2px solid #cdbf98;border-radius:10px;
  transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;
}
.opt .L{flex:0 0 36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:bold}
.opt:hover:not(:disabled){transform:translateX(5px);border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blueBg);border-color:var(--blue);color:#0c2f66;animation:pop .45s}
.opt.correct .L{background:var(--blue);color:#fff}
.opt.wrong{background:var(--redBg);border-color:var(--red);color:#6b1614;animation:shake .45s}
.opt.wrong .L{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font-size:1.25rem;font-weight:bold;min-height:70px}

.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:10px;border-left:6px solid;animation:rise .4s ease both}
.feedback.show{display:block}
.feedback.ok{background:var(--blueBg);border-color:var(--blue);color:#0c2f66}
.feedback.no{background:var(--redBg);border-color:var(--red);color:#6b1614}
.feedback h3{font-size:1.1rem;margin-bottom:4px}
.feedback p{line-height:1.5}
.next{margin-top:16px;display:none}
.next.show{display:block}

.big{font-size:3.2rem;text-align:center;color:var(--navy);font-weight:bold;margin:6px 0}
.big small{font-size:1.5rem;color:#46506a}
.ring{width:170px;height:170px;margin:10px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--blue) calc(var(--p)*1%),#d6cba9 0);position:relative;animation:float 3.5s ease-in-out infinite}
.ring::before{content:"";position:absolute;inset:12px;background:var(--parch);border-radius:50%}
.ring span{position:relative;font-size:2rem;font-weight:bold;color:var(--navy)}
.msg{text-align:center;font-size:1.15rem;margin:10px 0 22px;color:#46506a;font-style:italic}

.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media (max-width:560px){
  h1{font-size:1.55rem}.panel{padding:20px 15px}.question{font-size:1.15rem}
  .brand img{width:120px;height:120px}
  .opts.tf{grid-template-columns:1fr 1fr}
  .hud img{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  {t:"tf", q:"In Fedax v. Venezuela (1997), promissory notes endorsed to foreigners were accepted as an investment for the purposes of BITs.", a:true,

    b.type="button"; b.className="opt";
    if(q.t==="mc"){
      var L=document.createElement("span"); L.className="L"; L.textContent="ABCD".charAt(i);
      b.appendChild(L);
    }
    var s=document.createElement("span"); s.textContent=it.label; b.appendChild(s);
    b._val=it.val;
    b.addEventListener("click",function(){ choose(b,q); });
    box.appendChild(b);
  });
}

function choose(btn,q){
  if(answered) return;
  answered=true;
  var ok = (btn._val===q.a);
  var btns=$("opts").querySelectorAll(".opt");
  Array.prototype.forEach.call(btns,function(b){
    b.disabled=true;
    if(b._val===q.a) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(ok){ score++; streak++; $("score").textContent=score; burst(18); } else { streak=0; }
  var fb=$("feedback");
  fb.className="feedback show "+(ok?"ok":"no");
  $("fbTitle").textContent = ok ? "\u2714 Correct!" : "\u2716 Incorrect";
  $("fbText").textContent = q.e;
  $("barFill").style.width = ((idx+1)/total*100)+"%";
  $("nextBtn").className="btn next show";
  setTimeout(function(){ $("nextBtn").scrollIntoView({behavior:"smooth",block:"nearest"}); },150);
}

function next(){
  if(!answered) return;
  idx++;
  if(idx>=total){ finish(); } else { renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function finish(){
  var pct=Math.round(score/total*100);
  $("finalScore").textContent=score;
  $("pct").textContent=pct+"%";
  $("ring").style.setProperty("--p",pct);
  var m;
  if(pct===100) m="Flawless! Outstanding mastery of the material.";
  else if(pct>=80) m="Excellent work! You have a strong command of the topic.";
  else if(pct>=60) m="Good effort. A little more review and you will master it.";
  else m="Keep studying and try again \u2014 you can improve.";
  $("finalMsg").textContent=m;
  show("result");
  if(pct>=60) burst(pct>=80?70:35);
}

function burst(n){
  var colors=["#c9a24b","#e6c878","#1f5fbf","#f6efdc","#ffffff"];
  for(var i=0;i<n;i++){
    var c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.6+Math.random()*1.8)+"s";
    c.style.animationDelay=(Math.random()*0.3)+"s";
    document.body.appendChild(c);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },4000); })(c);
  }
}

$("startBtn").addEventListener("click",startQuiz);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",startQuiz);
})();
</script>
</body>
</html>
