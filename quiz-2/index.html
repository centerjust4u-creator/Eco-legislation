<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco legislation Quiz 2 | Center JUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1226; --navy2:#101c3a; --brass:#c9a24b; --brass2:#e4c777;
  --parch:#f5ecd7; --parch2:#ebdfc0; --ink:#1d2433;
  --good:#1f4fc4; --goodbg:#dfe8ff; --bad:#b3262e; --badbg:#fde2e2;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Lora',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body);color:var(--parch);
  background:
    radial-gradient(1200px 600px at 50% -10%,#1b2d5a 0%,transparent 60%),
    repeating-linear-gradient(45deg,rgba(201,162,75,.035) 0 2px,transparent 2px 14px),
    var(--navy);
  background-attachment:fixed;
  display:flex;justify-content:center;padding:18px 14px 40px;
}
.wrap{width:100%;max-width:760px}
.screen{display:none}
.screen.active{display:block;animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.logo-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.logo{border-radius:50%;background:#000;object-fit:cover;border:3px solid var(--brass);box-shadow:0 0 0 6px rgba(201,162,75,.15),0 10px 30px rgba(0,0,0,.6)}
.logo.big{width:200px;height:200px}
.logo.small{width:64px;height:64px;border-width:2px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.brand{font-family:var(--serif);font-weight:700;letter-spacing:.14em;color:var(--brass2);font-size:1.5rem}
.brand.small{font-size:1.05rem}

/* intro */
.intro{text-align:center;padding:26px 8px}
.intro h1{font-family:var(--serif);font-size:clamp(2.2rem,8vw,3.4rem);color:var(--parch);margin:22px 0 8px;line-height:1.05}
.rule{height:2px;width:140px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.intro p.sub{font-size:1.05rem;color:#d9d0b8;max-width:480px;margin:0 auto 22px;line-height:1.6}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.chip{border:1px solid var(--brass);border-radius:999px;padding:8px 16px;font-size:.95rem;color:var(--brass2);background:rgba(201,162,75,.07)}

.btn{
  font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--brass2),var(--brass));color:#1b1405;
  border:none;border-radius:12px;padding:16px 38px;min-height:56px;cursor:pointer;
  box-shadow:0 6px 0 #8a6d28,0 12px 24px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6d28,0 6px 12px rgba(0,0,0,.4)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--brass2);line-height:1.1}
.top .t span{font-size:.8rem;color:#b9b19a}
.score{border:1px solid var(--brass);border-radius:10px;padding:6px 12px;text-align:center;background:rgba(201,162,75,.08);transition:transform .25s}
.score.pop{transform:scale(1.15)}
.score small{display:block;font-size:.68rem;color:#b9b19a}
.score strong{font-family:var(--serif);font-size:1.4rem;color:var(--brass2)}
.progress-row{display:flex;justify-content:space-between;font-size:.95rem;color:#d9d0b8;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:#1a2748;border:1px solid rgba(201,162,75,.4);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass2));transition:width .5s ease}

.card{
  background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);
  border-radius:16px;padding:24px 20px;border:2px solid var(--brass);
  box-shadow:0 0 0 5px rgba(201,162,75,.18),0 18px 40px rgba(0,0,0,.55);
}
.qtype{display:inline-block;font-size:.8rem;font-weight:600;color:#6b5314;background:rgba(201,162,75,.3);border-radius:6px;padding:3px 10px;margin-bottom:12px}
.qtext{font-family:var(--serif);font-size:clamp(1.4rem,4.6vw,1.8rem);font-weight:700;line-height:1.3;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  font-family:var(--body);font-size:1.02rem;line-height:1.45;color:var(--ink);
  background:#fffaf0;border:2px solid #cdbb8c;border-radius:12px;padding:14px 14px;min-height:54px;cursor:pointer;
  transition:transform .15s,border-color .15s,background .15s;
}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--brass);background:#fff3d6}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy2);color:var(--brass2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.1rem}
.opt:disabled{cursor:default}
.opt.tf{justify-content:center;font-family:var(--serif);font-size:1.5rem;font-weight:700;min-height:64px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.correct{background:var(--goodbg);border-color:var(--good);color:#0d2a78}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:#6d0f15;animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.fb{display:none;margin-top:18px;border-radius:12px;padding:14px 16px;line-height:1.55;border-left:6px solid}
.fb.show{display:block;animation:rise .35s ease both}
.fb.ok{background:var(--goodbg);border-color:var(--good);color:#0d2a78}
.fb.no{background:var(--badbg);border-color:var(--bad);color:#6d0f15}
.fb b{display:block;font-family:var(--serif);font-size:1.3rem;margin-bottom:3px}
.next{display:none;margin:20px auto 0}
.next.show{display:block}

/* results */
.res{text-align:center;padding:20px 6px}
.res h2{font-family:var(--serif);font-size:2.2rem;margin:16px 0 4px}
.ring{width:190px;height:190px;border-radius:50%;margin:18px auto;display:grid;place-items:center;
  background:conic-gradient(var(--brass2) calc(var(--p)*1%),#1a2748 0);position:relative}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--navy)}
.ring span{position:relative;font-family:var(--serif);font-size:3rem;font-weight:700;color:var(--brass2)}
.res .msg{max-width:460px;margin:0 auto 24px;color:#d9d0b8;line-height:1.6;font-size:1.05rem}

.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.card{padding:18px 14px}.logo.big{width:160px;height:160px}}
</style>
</head>

  {type:"mc", q:"FDI can be especially important in developing countries because it may provide:",
   o:["An end to all imports","Technology transfer and managerial expertise","Automatic elimination of poverty","Complete freedom from regulation"], a:1,
   e:"Technology transfer and skill-building can address gaps in technology and management."},
  {type:"mc", q:"Which of the following is a potential economic disadvantage of FDI?",
   o:["Improved resource allocation","Technology transfer","Crowding-out of domestic firms","Increased innovation"], a:2,
   e:"Foreign firms may displace domestic competitors and reduce local employment."},
  {type:"mc", q:"Why may some host governments be concerned about large multinational enterprises?",
   o:["They always employ only local workers","They may use their economic power to drive local competitors out of business","They cannot obtain funds from abroad","They are unable to enter domestic markets"], a:1,
   e:"Their financial resources may allow them to subsidize costs and potentially monopolize the market."},
  {type:"mc", q:"The repatriation of profits refers to:",
   o:["Sending foreign investors' profits back to their home country","Transferring local taxes to domestic firms","Importing raw materials into the host country","Paying wages to local employees"], a:0,
   e:"Foreign investors may send profits earned in the host country back to their home country."},
  {type:"mc", q:"A foreign subsidiary imports a substantial number of inputs from abroad. This may result in a debit on the host country's:",
   o:["Capital account only","Government budget only","Current account","Domestic wage account"], a:2,
   e:"Imports of inputs are identified as a debit on the current account of the balance of payments."},
  {type:"mc", q:"Which of the following may limit the benefits of FDI in developing countries?",
   o:["Strong competition","Adequate regulatory frameworks","High technological capacity","Insufficient openness to trade"], a:3,
   e:"Insufficient openness to trade is one of the factors that may restrict FDI benefits."},
  {type:"mc", q:"The \u201Crace to the bottom\u201D in relation to FDI refers to governments:",
   o:["Increasing environmental standards in every case","Relaxing regulations to attract foreign investment","Preventing all foreign investment","Requiring every firm to export all its output"], a:1,
   e:"Governments may weaken environmental or workplace regulation to compete for foreign investment."},
  {type:"mc", q:"Which of the following best describes a sweatshop?",
   o:["A factory with high wages and excellent conditions","A research center focused on innovation","A small factory with very low wages, long hours, and poor working conditions","A government agency regulating foreign firms"], a:2,
   e:"Sweatshops are associated with low pay, long hours, and dangerous or inhumane conditions."},
  {type:"mc", q:"How might FDI adversely affect domestic employment?",
   o:["Foreign firms may replace jobs in local firms that lose market share","Every foreign investment creates only permanent jobs","Foreign firms must employ all available local workers","FDI always eliminates unemployment"], a:0,
   e:"Jobs created by foreign firms may be offset by job losses among domestic competitors."},
  {type:"mc", q:"Which factor is essential for absorbing new technologies and management skills?",
   o:["Weak workplace regulation","Reduced educational standards","Limited access to trade","A well-educated and healthy workforce"], a:3,
   e:"Human capital helps the host country benefit from technologies and management skills."},
  {type:"mc", q:"Which approach helps maximize the benefits of FDI?",
   o:["Removing all environmental laws","Creating a healthy business environment with strong regulation and incentives for innovation","Preventing local firms from competing","Restricting all imports and exports"], a:1,
   e:"A healthy enabling environment supports investment, innovation, skill development, and competition."}
];

var LETTERS = ["A","B","C","D"];
var $ = function(id){return document.getElementById(id);};
var order = [], idx = 0, score = 0, streak = 0, answered = false;

function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function show(id){
  ["intro","quiz","results"].forEach(function(s){ $(s).classList.toggle("active", s===id); });
  window.scrollTo(0,0);
}

/* intro counts */
var nTF = QUESTIONS.filter(function(q){return q.type==="tf";}).length;
var nMC = QUESTIONS.length - nTF;
$("cTotal").textContent = QUESTIONS.length + " Questions";
$("cTF").textContent = nTF + " True / False";
$("cMC").textContent = nMC + " Multiple Choice";

function startQuiz(){
  order = shuffle(QUESTIONS);
  idx = 0; score = 0; streak = 0;
  $("scoreNum").textContent = "0";
  show("quiz");
  render();
}

function render(){
  var q = order[idx]; answered = false;
  $("progText").textContent = "Question " + (idx+1) + " of " + order.length;
  $("streakText").textContent = streak >= 2 ? ("\uD83D\uDD25 " + streak + " in a row") : "";
  $("barFill").style.width = (idx/order.length*100) + "%";
  $("qType").textContent = q.type==="tf" ? "True or False" : "Multiple Choice";
  $("qText").textContent = q.q;
  var box = $("opts"); box.innerHTML = "";

  if(q.type==="tf"){
    var row = document.createElement("div"); row.className = "tfrow";
    [true,false].forEach(function(val){
      var b = document.createElement("button");
      b.type="button"; b.className="opt tf"; b.textContent = val ? "True" : "False";
      b.dataset.val = String(val);
      b.addEventListener("click", function(){ choose(val, b); });
      row.appendChild(b);
    });
    box.appendChild(row);
  } else {
    var wrap = document.createElement("div"); wrap.className = "opts";
    q.o.forEach(function(text,i){
      var b = document.createElement("button");
      b.type="button"; b.className="opt";
      var k = document.createElement("span"); k.className="k"; k.textContent = LETTERS[i];
      var t = document.createElement("span"); t.textContent = text;
      b.appendChild(k); b.appendChild(t);
      b.dataset.val = String(i);
      b.addEventListener("click", function(){ choose(i, b); });
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }
  var fb = $("fb"); fb.className = "fb"; fb.innerHTML = "";
  var nb = $("nextBtn"); nb.classList.remove("show");
  nb.textContent = (idx === order.length-1) ? "See my results" : "Next question";
}

function choose(val, btn){
  if(answered) return; answered = true;
  var q = order[idx], ok = (val === q.a);
  var buttons = $("opts").querySelectorAll(".opt");
  buttons.forEach(function(b){
    b.disabled = true;
    if(b.dataset.val === String(q.a)) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(ok){ score++; streak++; $("scoreNum").textContent = score;
    var sb = $("scoreBox"); sb.classList.add("pop"); setTimeout(function(){sb.classList.remove("pop");},250);
  } else { streak = 0; }
  $("streakText").textContent = streak >= 2 ? ("\uD83D\uDD25 " + streak + " in a row") : "";
  $("barFill").style.width = ((idx+1)/order.length*100) + "%";

  var fb = $("fb");
  fb.className = "fb show " + (ok ? "ok" : "no");
  var h = document.createElement("b"); h.textContent = ok ? "Correct!" : "Incorrect";
  var p = document.createElement("span"); p.textContent = q.e;
  fb.appendChild(h); fb.appendChild(p);
  $("nextBtn").classList.add("show");
  setTimeout(function(){ $("nextBtn").scrollIntoView({behavior:"smooth",block:"nearest"}); },80);
}

function next(){
  if(!answered) return;
  idx++;
  if(idx >= order.length) finish(); else { render(); window.scrollTo(0,0); }
}

function finish(){
  var total = order.length, pct = Math.round(score/total*100);
  $("finalScore").textContent = score + " / " + total;
  $("pct").textContent = pct + "%";
  $("ring").style.setProperty("--p", pct);
  var m;
  if(pct===100) m="Flawless. You have mastered this material.";
  else if(pct>=80) m="Excellent work. Your understanding of the topic is strong.";
  else if(pct>=60) m="Good effort. Review the points you missed and try again.";
  else m="Keep studying. Restart the quiz and aim to beat this score.";
  $("finalMsg").textContent = m;
  show("results");
  if(pct>=70) confetti();
}

function confetti(){
  var colors = ["#c9a24b","#e4c777","#1f4fc4","#f5ecd7","#b3262e"];
  for(var i=0;i<60;i++){
    var c = document.createElement("div"); c.className="confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2.2 + Math.random()*2.2) + "s";
    c.style.animationDelay = (Math.random()*0.8) + "s";
    document.body.appendChild(c);
    (function(el){ setTimeout(function(){ el.remove(); }, 5500); })(c);
  }
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", next);
$("restartBtn").addEventListener("click", startQuiz);
})();
</script>
</body>
</html>
